# -- Rule engine initialization ----------------------------------------------
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# -- Request body handling ---------------------------------------------------
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# -- File upload handling ----------------------------------------------------
SecTmpDir /tmp/
SecDataDir /tmp/

# -- Debug log configuration -------------------------------------------------
SecDebugLog /var/log/modsec/debug.log
SecDebugLogLevel 0

# -- Audit log configuration -------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

# -- Miscellaneous -----------------------------------------------------------
SecArgumentSeparator &

# -- Response body handling --------------------------------------------------
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -- Custom Rules ------------------------------------------------------------

# Block SQL Injection attempts
SecRule ARGS "@detectSQLi" \
    "id:1001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'SQL Injection Attack Detected',\
    severity:CRITICAL,\
    t:none,t:urlDecodeUni,t:lowercase"

# Block XSS attempts
SecRule ARGS "@detectXSS" \
    "id:1002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'XSS Attack Detected',\
    severity:CRITICAL,\
    t:none,t:urlDecodeUni"

# Block path traversal
SecRule REQUEST_URI|ARGS|ARGS_NAMES "@rx \.\.[/\\]" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Path Traversal Attack Detected',\
    severity:CRITICAL"

# Block command injection
SecRule ARGS "@rx [\;\|\`]\s*(?:bash|sh|csh|ksh|zsh|perl|python|ruby|php)" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Command Injection Attack Detected',\
    severity:CRITICAL,\
    t:none,t:urlDecodeUni,t:lowercase"

# Block malicious user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?:nmap|nikto|sqlmap|metasploit|nessus|openvas|w3af|burp)" \
    "id:1005,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Malicious Scanner Detected',\
    severity:WARNING,\
    t:none,t:lowercase"

# Rate limiting rule
SecAction \
    "id:1006,\
    phase:1,\
    nolog,\
    pass,\
    initcol:ip=%{REMOTE_ADDR},\
    setvar:ip.requests=+1,\
    expirevar:ip.requests=60"

SecRule IP:REQUESTS "@gt 100" \
    "id:1007,\
    phase:1,\
    deny,\
    status:429,\
    log,\
    msg:'Rate limit exceeded - More than 100 requests per minute',\
    severity:WARNING"

# Block suspicious file uploads
SecRule FILES_NAMES "@rx (?i:\.(?:php|exe|sh|bat|cmd|com|pif|scr|vbs|js|jar|war)$)" \
    "id:1008,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Suspicious File Upload Attempt',\
    severity:CRITICAL"

# Block requests without User-Agent
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1010,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Request Missing User-Agent Header',\
    severity:NOTICE"

# Include OWASP CRS
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/rules/*.conf