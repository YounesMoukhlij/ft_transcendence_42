services:
  Frontend:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.front
    container_name: frontend
    image: frontend:0.1
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - Backend
    networks:
      - monitoring
    volumes:
      - ./frontend:/var/www/nextApp
    command: sh -c "npm install && npm run dev"

  Backend:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.back
    container_name: backend
    image: backend:0.1
    restart: always
    ports:
      - "4444:4444"
    networks:
      - monitoring
    depends_on:
      - Redis

  Redis:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.redis
    container_name: redis
    image: redis:0.1
    restart: always
    ports:
      - "6370:6379"
    networks:
      - monitoring

  nginx:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.nginx
    container_name: nginx
    image: nginx:0.1
    ports:
      - "8080:8080"
    depends_on:
      - Frontend
    restart: always
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

