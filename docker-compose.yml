services:
  Frontend:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.front
    container_name: frontend
    image: frontend:0.1
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - Backend
  Backend:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.back
    container_name: backend
    image: backend:0.1
    restart: always
    ports:  
      - "4444:4444"
    networks:
      - monitoring

  nginx:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.nginx
    container_name: nginx
    image: nginx:0.1
    ports:
    - "8080:8080"
    depends_on:
      - Frontend
    restart: always


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge